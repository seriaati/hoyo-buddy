name: Render ZZZ Spine animations

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      agents:
        description: "Agent IDs separated by spaces, or 'all'. Empty renders agents not in spine.yaml yet."
        required: false
        default: ""

concurrency:
  group: render-zzz-spine

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout assets
        uses: actions/checkout@v7
        with:
          repository: seriaati/hoyo-buddy-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: hoyo-buddy-assets
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Project
        run: uv sync --frozen --no-dev

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/zzz_spine/package-lock.json

      - name: Install renderer
        run: npm ci --prefix scripts/zzz_spine

      - name: Render
        env:
          AGENTS: ${{ inputs.agents }}
          IMG_UPLOAD_API_KEY: ${{ secrets.IMG_UPLOAD_API_KEY }}
          # Required by hoyo_buddy.config, unused by the script
          DISCORD_TOKEN: unused
          DISCORD_CLIENT_ID: "0"
          DISCORD_CLIENT_SECRET: unused
          DB_URL: unused
          FERNET_KEY: unused
        run: |
          if [ -z "$AGENTS" ]; then
            args="--new"
          elif [ "$AGENTS" = "all" ]; then
            args="--all"
          else
            args="$AGENTS"
          fi
          uv run scripts/render_zzz_spine.py $args

      # Push whatever rendered, even if some agents failed
      - name: Push assets
        if: ${{ !cancelled() }}
        working-directory: hoyo-buddy-assets
        run: |
          git add assets/zzz-build-card/spine.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(zzz): update Spine renders"
          git pull --rebase
          git push

      - name: Bump assets submodule
        if: ${{ !cancelled() }}
        run: |
          git add hoyo-buddy-assets
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump hoyo-buddy-assets for ZZZ Spine renders"
          git pull --rebase
          git push
