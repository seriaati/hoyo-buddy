name: Render Spine animations

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      zzz:
        description: "ZZZ agent IDs separated by spaces, 'all' or 'skip'. Empty renders agents not in spine.yaml yet."
        required: false
        default: ""
      hsr:
        description: "HSR character IDs separated by spaces, 'all' or 'skip'. Empty renders characters not in spine.yaml yet."
        required: false
        default: ""

concurrency:
  group: render-spine

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMG_UPLOAD_API_KEY: ${{ secrets.IMG_UPLOAD_API_KEY }}
      # Discord webhook for new HSR characters whose suggested framing needs a look
      SPINE_WEBHOOK_URL: ${{ secrets.SPINE_WEBHOOK_URL }}
      # Required by hoyo_buddy.config, unused by the scripts
      DISCORD_TOKEN: unused
      DISCORD_CLIENT_ID: "0"
      DISCORD_CLIENT_SECRET: unused
      DB_URL: unused
      FERNET_KEY: unused
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout assets
        uses: actions/checkout@v7
        with:
          repository: seriaati/hoyo-buddy-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: hoyo-buddy-assets
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Project
        run: uv sync --frozen --no-dev

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/spine/package-lock.json

      - name: Install renderer
        run: npm ci --prefix scripts/spine

      # Renders HSR even if some ZZZ agents failed
      - name: Render
        env:
          ZZZ: ${{ inputs.zzz }}
          HSR: ${{ inputs.hsr }}
        run: |
          args() { case "$1" in "") echo --new ;; all) echo --all ;; *) echo "$1" ;; esac; }
          status=0
          [ "$ZZZ" = skip ] || uv run scripts/render_zzz_spine.py $(args "$ZZZ") || status=1
          [ "$HSR" = skip ] || uv run scripts/render_hsr_spine.py $(args "$HSR") || status=1
          exit $status

      # Push whatever rendered, even if some characters failed
      - name: Push assets
        if: ${{ !cancelled() }}
        working-directory: hoyo-buddy-assets
        run: |
          git add assets/*/spine.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Spine renders"
          git pull --rebase
          git push

      - name: Bump assets submodule
        if: ${{ !cancelled() }}
        run: |
          git add hoyo-buddy-assets
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump hoyo-buddy-assets for Spine renders"
          git pull --rebase --no-recurse-submodules --no-tags
          git push
